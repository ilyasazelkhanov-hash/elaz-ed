<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#25213d"/><stop offset="1" stop-color="#12333a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#a8dfcf"/></marker></defs><rect width="440" height="650" rx="24" fill="url(#bg)"/><g font-family="sans-serif" text-anchor="middle"><text x="220" y="42" fill="#eee8ff" font-size="21">От вопроса к проверяемому ответу</text><rect x="28" y="76" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="102" fill="#f1edff" font-size="18">1 · Вопрос</text><text x="220" y="124" fill="#c9c2df" font-size="13">Разрешённые синтетические данные</text><path d="M220 138v19" stroke="#a8dfcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="162" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="188" fill="#f1edff" font-size="18">2 · Права и актуальность</text><text x="220" y="210" fill="#c9c2df" font-size="13">Архив и закрытые записи исключены</text><path d="M220 224v19" stroke="#a8dfcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="248" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="274" fill="#f1edff" font-size="18">3 · Поиск источника</text><text x="220" y="296" fill="#c9c2df" font-size="13">BM25-подобный baseline</text><path d="M220 310v19" stroke="#a8dfcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="334" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="360" fill="#f1edff" font-size="18">4 · Ответ и цитата</text><text x="220" y="382" fill="#c9c2df" font-size="13">Извлечение / отдельный вызов модели</text><path d="M220 396v19" stroke="#a8dfcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="420" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="446" fill="#f1edff" font-size="18">5 · Проверка</text><text x="220" y="468" fill="#c9c2df" font-size="13">Структура не доказывает весь смысл</text><path d="M220 482v19" stroke="#a8dfcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="506" width="384" height="62" rx="12" fill="#242840" stroke="#8e79c4"/><text x="220" y="532" fill="#f1edff" font-size="18">6 · Ответ или человек</text><text x="220" y="554" fill="#c9c2df" font-size="13">Неизвестное не придумывается</text><text x="220" y="624" fill="#b2dfd2" font-size="13">В базовом режиме настоящая модель не вызывается</text></g></svg>
