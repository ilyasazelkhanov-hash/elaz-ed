<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="title desc">
<title id="title">DS-301-M4: порядок занятий</title>
<desc id="desc">4.1. Продуктовые показатели и UX-долг; 4.2. Оценка ресурсов и сценарии погашения долга; 4.3. Дорожная карта на 90 дней с контрольными решениями; 4.4. Защита дизайн-стратегии и границ автоматизации</desc>
