<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title description">
<title id="title">Путь учебной заявки</title><desc id="description">Заявка проходит проверку полей, проверку повтора, выбор очереди и запись. Неверные данные отклоняются. Итоговое уведомление остаётся черновиком.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#25213d"/><stop offset="1" stop-color="#12333a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#a8dfcf"/></marker></defs>
<rect width="440" height="650" rx="24" fill="url(#bg)"/>
<g font-family="sans-serif" text-anchor="middle"><text x="220" y="40" fill="#e5dcff" font-size="20" font-weight="700">Заявка без потерь и дублей</text><text x="220" y="65" fill="#c4bed9" font-size="13">Учебный процесс · внешней отправки нет</text></g>
<g stroke="#a8dfcf" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M220 143v27"/><path d="M220 227v27"/><path d="M220 311v27"/><path d="M220 395v27"/><path d="M220 479v27"/></g>
<g fill="#242840" stroke="#8e79c4" stroke-width="1.5"><rect x="45" y="88" width="350" height="55" rx="12"/><rect x="45" y="172" width="350" height="55" rx="12"/><rect x="45" y="256" width="350" height="55" rx="12"/><rect x="45" y="340" width="350" height="55" rx="12"/><rect x="45" y="424" width="350" height="55" rx="12"/><rect x="45" y="508" width="350" height="55" rx="12"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#f1edff" font-size="16"><text x="220" y="113">1 · Форма: ID, email, обращение</text><text x="220" y="133" fill="#bfb8d6" font-size="12">Только вымышленные данные</text><text x="220" y="197">2 · Проверка обязательных полей</text><text x="220" y="217" fill="#bfb8d6" font-size="12">Неполный вход → отказ с причиной</text><text x="220" y="281">3 · Проверка прежнего ID</text><text x="220" y="301" fill="#bfb8d6" font-size="12">Повтор → существующий результат</text><text x="220" y="365">4 · Выбор очереди</text><text x="220" y="385" fill="#bfb8d6" font-size="12">Неясный или неверный выход → человек</text><text x="220" y="449">5 · Строка + черновик</text><text x="220" y="469" fill="#bfb8d6" font-size="12">После сбоя проверь, что сохранено</text><text x="220" y="533">6 · Ручная проверка</text><text x="220" y="553" fill="#bfb8d6" font-size="12">Черновик не равен отправке</text><text x="220" y="605" fill="#b1dfd2" font-size="14">История узлов объясняет каждый переход</text></g></svg>
