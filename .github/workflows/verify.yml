name: Verify application
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_smoke:
        description: Run read-only checks against the deployed frontend and API
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  master:
    name: Master platform and client templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Azelkhanov-master
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: Azelkhanov-master/package-lock.json
      - name: Install standalone master dependencies
        run: npm ci --ignore-scripts
      - name: Test generator, templates, API and local database
        run: npm test
      - name: Typecheck master server
        run: npm run test:server-types
      - name: Build standalone master
        run: npm run build
  edge-api:
    name: Edge API and release tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: API behavior with isolated database and Telegram fakes
        run: npm run test:api
      - name: Release contract and recovery reconciliation
        run: node --test tests/release-operations.test.mjs
      - name: Synthetic recovery comparison
        run: node scripts/verify-recovery.mjs --fixture
      - name: Fingerprint release sources
        run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-source-manifest
          path: test-results/release-manifest.json
  edge-types:
    name: Edge API typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Typecheck the actual Edge Function graph
        run: deno check --no-config --no-lock supabase/functions/api/index.ts
  production-smoke:
    name: Published release smoke
    if: github.event_name == 'workflow_dispatch' && inputs.production_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify deployed identity, release contract and auth denials
        run: node scripts/release-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-release-smoke
          path: test-results/release-smoke.json
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12.10
      - name: Install FFmpeg 8.1.2 and verify archive
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          $expected = 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec'
          if ((Get-FileHash "$env:RUNNER_TEMP/ffmpeg.zip" -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg"
          (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Directory | Select-Object -First 1).FullName + '/bin' >> $env:GITHUB_PATH
      - run: npm ci
      - name: All tests and production build in isolated directory
        run: npm run test:all
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Mobile browser smoke against the same build
        run: node scripts/og-product-browser.mjs
      - name: Asset baseline for the same build
        shell: pwsh
        run: |
          $build = (Get-Content test-results/audit-validation.json -Raw | ConvertFrom-Json).out
          node scripts/perf-assets.mjs --dist (Join-Path $build dist) --include App --out test-results/perf-assets.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-release-evidence
          path: |
            test-results/og-product-browser.json
            test-results/perf-assets.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-results
          path: test-results/*.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-summary
          path: test-results/audit-validation.json

