<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебная запись · Маяк</title><body><main><h1>Учебная запись в мастерскую</h1><p>Локальный прототип. Используй вымышленные данные. Доступны учебные слоты января 2030, 09:00–11:00. Уведомления мастерской не отправляются.</p><form id="auth"><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Учебный пароль <input name="password" type="password" minlength="12" maxlength="128" required autocomplete="current-password"></label><button name="action" value="register">Создать учебный аккаунт</button><button name="action" value="login">Войти</button></form><section id="workspace" hidden><form id="booking"><label>Дата и время <input name="slot" type="datetime-local" min="2030-01-01T09:00" max="2030-01-31T11:00" required></label><button>Записаться</button></form><button id="refresh">Обновить мои записи</button><button id="logout">Выйти</button><h2>Мои записи</h2><ul id="bookings"></ul></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="/client.mjs"></script></body></html>
