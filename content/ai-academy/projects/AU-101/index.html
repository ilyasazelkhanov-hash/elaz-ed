<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лаборатория автоматизации</title><link rel="stylesheet" href="style.css"><body><main><h1>Заявка → таблица → черновик</h1><p>Локальный учебный симулятор. AI и внешние сервисы не вызываются. Для шага AI можно выбрать заранее записанный пример ответа.</p><section><h2>1. Настрой процесс</h2><label><input id="enabled" type="checkbox" checked> Принимать заявки</label><label><input id="requireEmail" type="checkbox" checked> Проверять email</label><label>Пример ответа модели <select id="model"><option value="none">Модель не вызывалась</option><option value="high">repair, confidence 0.95</option><option value="low">repair, confidence 0.40</option><option value="invalid">Неверный формат JSON</option></select></label><label>Учебный сбой <select id="failure"><option value="">Без сбоя</option><option value="table">Таблица недоступна</option><option value="notification">Сбой уведомления</option></select></label></section><form id="request"><h2>2. Отправь учебную заявку</h2><label>ID заявки <input name="id" value="REQ-001" required></label><label>Email <input name="email" value="learner@example.test"></label><label>Обращение <textarea name="message" required>Нужен ремонт учебного устройства</textarea></label><button>Запустить процесс</button></form><p id="status" role="status" aria-live="polite"></p><section><h2>3. История шагов</h2><ol id="events"></ol><h2>Сохранённые заявки</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Email</th><th>Очередь</th><th>Обращение</th></tr></thead><tbody id="rows"></tbody></table></div><h2>Черновики уведомлений</h2><ul id="notifications"></ul><button id="reset">Сбросить учебные данные</button></section></main><script type="module" src="client.mjs"></script></body></html>
